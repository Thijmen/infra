name: infra

# Preview on PRs from this repo's own branches, apply on main.
# Never switch to pull_request_target: it would hand a fork's PR these secrets.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # rerun after changing a secret (e.g. TRUSTED_IPS)

permissions:
  contents: read

# One run at a time against the state; never cancel an apply halfway.
concurrency:
  group: pulumi-prod
  cancel-in-progress: false

env:
  PULUMI_BACKEND_URL: s3://pulumi-state?endpoint=7dac805f31c2d6d9d0b73499d61513d2.r2.cloudflarestorage.com&region=auto&s3ForcePathStyle=true
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
  TRUSTED_IPS: ${{ secrets.TRUSTED_IPS }}

jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the preview comment
    steps:
      - name: Check secrets
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY PULUMI_CONFIG_PASSPHRASE TRUSTED_IPS; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets (env names; the R2 keys are R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY): ${missing[*]}. See README → First-time setup."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: preview
          stack-name: prod
          cloud-url: ${{ env.PULUMI_BACKEND_URL }}
          diff: true
          comment-on-pr: true
          edit-pr-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  up:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod # add required reviewers here if you want a manual gate
    steps:
      - name: Check secrets
        run: |
          missing=()
          for name in CLOUDFLARE_API_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY PULUMI_CONFIG_PASSPHRASE TRUSTED_IPS; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repo secrets (env names; the R2 keys are R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY): ${missing[*]}. See README → First-time setup."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          command: up
          stack-name: prod
          cloud-url: ${{ env.PULUMI_BACKEND_URL }}
          diff: true
